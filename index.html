<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>to Xuân Anh ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #fff8f5;
            color: #3b3030;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
            font-weight: 600;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .photo {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 18px;
            display: block;
            margin: 0 auto 30px;
        }

        .message {
            text-align: left;
            line-height: 1.8;
            font-size: 17px;
        }

        .heart {
            font-size: 28px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Xuân Anh ♡</h1>

        <div class="subtitle">
            Một chút gì đó anh muốn gửi em
        </div>

        <!--
            ĐỔI "images/photo.jpg" thành tên ảnh của mày.
            Ví dụ:
            <img src="images/christmas.jpg" ...>
        -->
        <img
            class="photo"
            src="images/photo.jpg"
            alt="Một kỷ niệm"
        >

        <div class="message">

            <p>
                Xuân Anh à,
            </p>

            <p>
                Anh làm cái này cũng khá lâu đấy =))
            </p>

            <p>
                Có một vài thứ anh muốn lưu lại,
                một vài kỷ niệm, và một vài điều mà anh muốn em biết.
            </p>

            <p>
                Mong là em sẽ thích.
            </p>

        </div>

        <div class="heart">
            ♡
        </div>

    </div>

</body>
</html>
